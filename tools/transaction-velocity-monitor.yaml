name: transaction-velocity-monitor
version: 1.0.0
description: "Calculates transaction volume velocity spikes against historical 90-day moving average"
input_schema:
  type: object
  properties:
    daily_volume:
      type: string
      description: "Today's transaction volume in USD"
  required:
    - daily_volume
implementation:
  type: script
  path: transaction_velocity_monitor.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true

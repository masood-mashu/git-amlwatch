name: structuring-smurfing-detector
version: 1.0.0
description: "Identifies sequential cash deposits structured just below the $10,000 CTR reporting threshold"
input_schema:
  type: object
  properties:
    deposits_json:
      type: string
      description: "JSON list of deposit amounts received in a 48-hour window"
  required:
    - deposits_json
implementation:
  type: script
  path: structuring_smurfing_detector.py
  runtime: python3
annotations:
  read_only: true
  idempotent: true
